plugins { id 'com.android.application' }

android {
    namespace 'com.helloclyde.npe'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.helloclyde.npe'
        minSdk 23
        targetSdk 35
        versionCode 210
        versionName '0.2.10'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments '-DBUILD_TESTING=OFF', '-DNPE_BUNDLED_SDL=ON', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
        }
    }
    externalNativeBuild { cmake { path '../../npe-sdl/CMakeLists.txt'; version '3.22.1' } }
    sourceSets {
        main {
            java.srcDirs += ['../../vendor/SDL-2.32.10/android-project/app/src/main/java']
            assets.srcDirs = [layout.buildDirectory.dir('generated/npe-assets')]
        }
    }
}

tasks.register('copyNativeAssets', Sync) {
    into layout.buildDirectory.dir('generated/npe-assets')
    from('../../npe-sdl/assets') {
        include 'gbk12-native.bin', 'gbk16-native.bin', 'FONT-LICENSE.txt', 'FONT-PROVENANCE.txt'
        into 'assets'
    }
    from('../../LICENSE') { into 'licenses' }
    from('../../npe-sdl/third-party/SDL2-LICENSE.txt') { into 'licenses' }
}
tasks.named('preBuild').configure { dependsOn 'copyNativeAssets' }
